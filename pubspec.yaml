name: booking_system
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # HTTP client
  http: ^1.2.2

  # Routing
  go_router: ^14.2.7

  # Typography
  google_fonts: ^6.2.1

  # Environment config
  flutter_dotenv: ^5.2.1

  # Token persistence
  shared_preferences: ^2.3.2

  # WebSocket Real-Time Client
  socket_io_client: ^3.0.2
  shimmer: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/app_logo.png
